alias eq_slot6    "slot6; set_slot6; switchhandsleft; cl_crosshaircolor_b 55; cl_crosshaircolor_g 55; cl_crosshaircolor_r 55"
alias eq_slot7    "slot7; set_slot7; switchhandsleft; cl_crosshaircolor_b 255; cl_crosshaircolor_g 255; cl_crosshaircolor_r 255"
alias eq_slot8    "slot8; set_slot8; switchhandsleft; cl_crosshaircolor_b 255; cl_crosshaircolor_g 255; cl_crosshaircolor_r 0"
alias eq_slot9    "slot9; set_slot9; switchhandsleft; cl_crosshaircolor_b 0; cl_crosshaircolor_g 255; cl_crosshaircolor_r 0"
alias eq_slot10   "slot10; set_slot10; switchhandsleft; cl_crosshaircolor_b 0; cl_crosshaircolor_g 255; cl_crosshaircolor_r 255"

