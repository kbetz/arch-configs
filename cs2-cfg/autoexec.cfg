//AUTOEXEC //

//Launch Options: -console -novid -nojoy -language english -no-browser


//--------------------------------------------------//
//NETWORK //

rate "786432"

//cl_cmdrate "128"
//cl_updaterate "128"
cl_timeout "30"
cl_interp "0"
cl_interp_ratio "1"
cl_lagcompensation "1"
cl_join_advertise "2"


//--------------------------------------------------//
//AUDIO //

windows_speaker_config "1"
snd_musicvolume "0"
snd_mixahead "0.025"
snd_headphone_pan_exponent "1"
snd_headphone_pan_radial_weight "1"


//--------------------------------------------------//
//INTERFACE //

player_nevershow_communityservermessage "1"

net_graphpos "2"
cl_buywheel_nomousecentering "1"
cl_showloadout "1"
cl_autowepswitch "0"
cl_radar_scale "0.4"
cl_radar_always_centered "0"
cl_use_opens_buy_menu "0"
cl_color "1"
cl_spec_mode "1"
cl_disablefreezecam "1"
cl_teamid_overhead_always "1"
mp_playerid_delay  "0"
mp_playerid_hold "0.01"


//--------------------------------------------------//
//CROSSHAIR //

cl_crosshair_drawoutline "1"
cl_crosshair_outlinethickness "1"
cl_crosshairusealpha "1"
cl_crosshairalpha "255"
cl_crosshaircolor "5"
cl_crosshaircolor_b "0"
cl_crosshaircolor_g "255"
cl_crosshaircolor_r "0"
cl_crosshairdot "0"
cl_crosshairgap "-0.5"
cl_crosshairgap_useweaponvalue "0"
cl_crosshairscale "0"
cl_crosshairsize "3"
cl_crosshairstyle "4"
cl_crosshairthickness "1"

cl_crosshair_sniper_width "2"
cl_observercrosshair "1"
cl_show_observer_crosshair "2"


//--------------------------------------------------//
//VIEWMODEL //

alias "my_vm" "viewmodel_fov 68; viewmodel_offset_x 2.4; viewmodel_offset_y 1.2; viewmodel_offset_z -1.6;"
viewmodel_presetpos "0"

cl_prefer_lefthanded "1"
cl_bobcycle "2"
cl_bob_lower_amt "0"
cl_bobamt_lat "0"
cl_bobamt_vert "0"
cl_viewmodel_shift_left_amt "0"
cl_viewmodel_shift_right_amt "0"


//--------------------------------------------------//
//ENGINE //

fps_max "240"
fps_max_menu "240"

//mat_queue_mode "2"
engine_no_focus_sleep "0"

//mat_monitorgamma "1.6"

//r_eyegloss "0"
//r_eyemove "0"
//r_eyeshift_x "0"
//r_eyeshift_y "0"
//r_eyeshift_z "0"
//r_eyesize "0"
//r_dynamic "1"

cl_predict "1"
cl_predictweapons "1"
cl_lagcompensation "1"


//--------------------------------------------------//
//MOUSE //

sensitivity "1.6"
zoom_sensitivity_ratio_mouse "0.8"

m_rawinput "1"
m_customaccel "0"
m_customaccel_scale "0"
m_mousespeed "0"
m_mouseaccel1 "0"
m_mouseaccel2 "0"


//--------------------------------------------------//
//BINDINGS //

bind "a" "+left"
bind "d" "+right"
bind "s" "+back"
bind "w" "+forward"

bind "space" "+jump"
bind "mwheelup" "+jump"
bind "mwheeldown" "+jump"

bind "shift" "+sprint"
bind "ctrl" "+duck"
bind "mouse4" "+duck"

bind "escape" "cancelselect"
bind "mouse3" "player_ping"

bind "z" "+lookatweapon"
bind "v" "+voicerecord"
bind "k" "messagemode"
bind "enter" "messagemode2"

bind "h" "say !r"
bind "p" "say Geile Hälfte!"
bind "," "say !guns"
bind "." "say !menu"

bind "n" "noclip"
bind "home" "disconnect"

bind "pgdn" "toggleconsole"

bind "y" "+spray_menu"
bind "u" "+radialradio"
bind "i" "+radialradio2"
bind "o" "+radialradio3"

alias "+instr" "gameinstructor_enable 1; +cl_show_team_equipment"
alias "-instr" "gameinstructor_enable 0; -cl_show_team_equipment"
bind "mouse5" "+instr; cl_removedecals"

bind "tab" "+showscores"

alias "warmup" "exec warmup.cfg; echo EXECUTED: Warmup sequence INITIATED."
bind "\" "warmup"

bind "'" "mp_restartgame 1"
bind "j" "bot_place"

bind "ralt" ""
bind "rshift" "bot_add"
bind "del" "bot_kick"
bind "semicolon" "toggle bot_mimic"

bind "uparrow" ""
bind "downarrow" "toggle bot_crouch"
bind "leftarrow" ""
bind "rightarrow" "toggle voice_enable"

bind "6" "slot12"
bind "7" "radio1"
bind "8" "radio2"
bind "9" "radio3"
bind "0" "radio"

bind "-" "invprev"
bind "=" "invnext"
bind "[" "invprev"
bind "]" "invnext"


//--------------------------------------------------//
//SLOT-SCRIPT //

bind "1" 			"eq_slot1"   //primary
bind "2" 			"eq_slot2"   //secondary
bind "3" 			"eq_slot3"   //melee
bind "5"			"eq_slot5"   //bomb
bind "4" 			"eq_slot6"   //grenade
bind "f" 			"eq_slot7"   //flash
bind "c" 			"eq_slot8"   //smoke
bind "x" 			"eq_slot9"   //decoy
bind "t" 			"eq_slot10"  //molotov/incendiary

alias "+qswitch"	"eq_slot3"
alias "-qswitch"	"eq_lastinv"
bind "q" 			"+qswitch" //quickswitch

alias eq_slot1    "slot1; set_slot1; switchhandsleft; cl_crosshaircolor_b 0; cl_crosshaircolor_g 255; cl_crosshaircolor_r 0"
alias eq_slot2    "slot2; set_slot2; switchhandsleft; cl_crosshaircolor_b 0; cl_crosshaircolor_g 255; cl_crosshaircolor_r 0"
